name: Build Imista Forward

on:
  push:
    branches: [ main, arena/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  RELAY_URL_DEFAULT: "https://imista-relay.vercel.app"

jobs:
  test:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      RELAY_URL: ${{ secrets.RELAY_URL || 'https://imista-relay.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          log-accepted-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          ls $ANDROID_HOME/platforms | head -n 20 || true

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Check Telegram & Relay secrets (no leak)
        env:
          TELEGRAM_BOT_KEY: ${{ secrets.TELEGRAM_BOT_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          echo "Relay URL: ${RELAY_URL:-$RELAY_URL_DEFAULT} (token never embedded in APK)"
          if [ -z "$TELEGRAM_BOT_KEY" ]; then
            echo "::warning::TELEGRAM_BOT_KEY secret not set — relay will run in mock mode."
          else
            echo "TELEGRAM_BOT_KEY configured (length ${#TELEGRAM_BOT_KEY}) — server-side only."
            if echo "$TELEGRAM_BOT_KEY" | grep -Eq '^[0-9]+:[A-Za-z0-9_-]+$'; then echo "Token format valid."; else echo "::warning::Token format invalid"; fi
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::TELEGRAM_CHAT_ID not set — relay will auto-discover via bot poll."
          else
            echo "TELEGRAM_CHAT_ID configured (length ${#TELEGRAM_CHAT_ID})"
            if echo "$TELEGRAM_CHAT_ID" | grep -Eq '^-?[0-9]+$'; then echo "Chat ID valid."; else echo "::warning::Chat ID invalid"; fi
          fi

      - name: Run unit tests (shared) - continue on error
        run: |
          echo "=== Shared tests ==="
          gradle :shared:testDebugUnitTest --stacktrace --info 2>&1 | tee /tmp/shared-test.log || echo "shared tests failed but continuing"
          cat /tmp/shared-test.log | tail -n 100
        continue-on-error: true

      - name: Build Sender Release APK (relay mode)
        id: build_sender
        run: |
          echo "=== Building Sender ==="
          set -o pipefail
          gradle :sender:assembleRelease --stacktrace --info 2>&1 | tee /tmp/sender-build.log
          EXIT=${PIPESTATUS[0]}
          echo "Sender build exit code: $EXIT"
          echo "=== Sender e: lines (grep) ==="
          grep -n "^e: " /tmp/sender-build.log 2>&1 | head -n 200 || echo "no e: lines"
          grep -n "error:" /tmp/sender-build.log 2>&1 | head -n 100 || true
          echo "=== Sender FAILED/context 20 lines ==="
          grep -n "FAILED" /tmp/sender-build.log 2>&1 | head -n 20 || true
          # Also dump tail 500 for context
          cat /tmp/sender-build.log | tail -n 500
          ls sender/build/outputs/apk/release/*.apk 2>&1 | head -n 20
          exit $EXIT

      - name: Upload Sender build log on failure
        if: failure() && steps.build_sender.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: sender-build-log
          path: /tmp/sender-build.log

      - name: Build Receiver Release APK (relay mode)
        id: build_receiver
        run: |
          echo "=== Building Receiver ==="
          set -o pipefail
          gradle :receiver:assembleRelease --stacktrace --info 2>&1 | tee /tmp/receiver-build.log
          EXIT=${PIPESTATUS[0]}
          echo "Receiver build exit code: $EXIT"
          echo "=== Receiver e: lines ==="
          grep -n "^e: " /tmp/receiver-build.log 2>&1 | head -n 200 || echo "no e: lines"
          grep -n "error:" /tmp/receiver-build.log 2>&1 | head -n 100 || true
          cat /tmp/receiver-build.log | tail -n 500
          echo "=== Receiver outputs ==="
          find . -maxdepth 4 -name "*.apk" -o -name "*.aab" | head -n 20
          ls -lh receiver/build/outputs/ 2>&1 | head -n 100 || echo "no receiver/build/outputs"
          exit $EXIT


      - name: Upload build logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/sender-build.log
            /tmp/receiver-build.log
          if-no-files-found: warn
      - name: "Extract e lines from build logs"
        if: failure()
        run: |
          echo "=== Sender e: lines ==="
          grep -n "^e: " /tmp/sender-build.log 2>&1 | head -n 200 || true
          echo "=== Sender error: lines ==="
          grep -n "error:" /tmp/sender-build.log 2>&1 | head -n 100 || true
          echo "=== Receiver e: lines ==="
          grep -n "^e: " /tmp/receiver-build.log 2>&1 | head -n 200 || true
          # Also emit to github step summary
          echo "### Sender e: excerpt" >> $GITHUB_STEP_SUMMARY
          grep -n "^e: " /tmp/sender-build.log 2>&1 | head -n 100 >> $GITHUB_STEP_SUMMARY || true
          grep -n "error:" /tmp/sender-build.log 2>&1 | head -n 50 >> $GITHUB_STEP_SUMMARY || true
      - name: Post build logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Posting build failure excerpt as commit comment..."
          if [ -f /tmp/sender-build.log ]; then
            SENDER_E=$(grep -n "^e: " /tmp/sender-build.log 2>&1 | head -n 40 || true)
            SENDER_CTX=""
            if [ -n "$SENDER_E" ]; then
              FIRST_LINE=$(echo "$SENDER_E" | head -n1 | cut -d: -f1)
              SENDER_CTX=$(sed -n "$((FIRST_LINE>20?FIRST_LINE-20:1)),$((FIRST_LINE+60))p" /tmp/sender-build.log 2>&1 | head -n 200)
            else
              SENDER_CTX=$(tail -n 400 /tmp/sender-build.log 2>&1 | head -n 400)
            fi
          else
            SENDER_E="no sender log"; SENDER_CTX="no sender log"
          fi
          if [ -f /tmp/receiver-build.log ]; then
            RECEIVER_E=$(grep -n "^e: " /tmp/receiver-build.log 2>&1 | head -n 40 || true)
            RECEIVER_CTX=""
            if [ -n "$RECEIVER_E" ]; then
              FIRST_LINE=$(echo "$RECEIVER_E" | head -n1 | cut -d: -f1)
              RECEIVER_CTX=$(sed -n "$((FIRST_LINE>20?FIRST_LINE-20:1)),$((FIRST_LINE+60))p" /tmp/receiver-build.log 2>&1 | head -n 200)
            else
              RECEIVER_CTX=$(tail -n 400 /tmp/receiver-build.log 2>&1 | head -n 400)
            fi
          else
            RECEIVER_E="no receiver log"; RECEIVER_CTX="no receiver log"
          fi
          cat > /tmp/comment_body.md <<'CMEOF'
          **Build failure — Sender e: lines**
          CMEOF
          echo '```' >> /tmp/comment_body.md
          echo "$SENDER_E" | head -c 6000 >> /tmp/comment_body.md
          echo '```' >> /tmp/comment_body.md
          echo '**Sender context (20 before / 60 after first e:)**' >> /tmp/comment_body.md
          echo '```' >> /tmp/comment_body.md
          echo "$SENDER_CTX" | head -c 6000 >> /tmp/comment_body.md
          echo '```' >> /tmp/comment_body.md
          echo '**Receiver e: lines**' >> /tmp/comment_body.md
          echo '```' >> /tmp/comment_body.md
          echo "$RECEIVER_E" | head -c 4000 >> /tmp/comment_body.md
          echo '```' >> /tmp/comment_body.md
          if [ -n "$RECEIVER_CTX" ] && [ "$RECEIVER_CTX" != "no receiver log" ]; then
            echo '**Receiver context**' >> /tmp/comment_body.md
            echo '```' >> /tmp/comment_body.md
            echo "$RECEIVER_CTX" | head -c 4000 >> /tmp/comment_body.md
            echo '```' >> /tmp/comment_body.md
          fi
          cat /tmp/comment_body.md | head -n 200
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat /tmp/comment_body.md | head -c 65000)" || echo "comment failed but continuing"
          echo "=== SENDER e: ===" && echo "$SENDER_E" | head -n 40
          echo "=== SENDER ctx ===" && echo "$SENDER_CTX" | head -n 40

      - name: Push build logs to debug branch on failure
        if: failure()
        run: |
          echo "Pushing logs to debug branch for inspection..."
          git config user.name "ci-bot"
          git config user.email "ci@imista.local"
          mkdir -p /tmp/debug-logs
          cp /tmp/sender-build.log /tmp/debug-logs/sender-build.log 2>/dev/null || echo "no sender log" > /tmp/debug-logs/sender-build.log
          cp /tmp/receiver-build.log /tmp/debug-logs/receiver-build.log 2>/dev/null || echo "no receiver log" > /tmp/debug-logs/receiver-build.log
          # Create branch debug-logs
          git checkout -B debug-logs
          mkdir -p debug-logs
          cp /tmp/debug-logs/*.log debug-logs/ 2>/dev/null || true
          git add debug-logs/
          git commit -m "ci: upload build logs for failure diagnosis [skip ci]" || echo "no commit needed"
          git push origin debug-logs --force || true

      - name: Upload Receiver build log to Gist on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading receiver build log to Gist for debugging..."
          if [ -f /tmp/receiver-build.log ]; then
            gh gist create --public --filename receiver-build.log /tmp/receiver-build.log || echo "gist failed"
            echo "=== Receiver log tail ==="
            tail -n 300 /tmp/receiver-build.log
          fi
          if [ -f /tmp/sender-build.log ]; then
            echo "=== Sender log tail ==="
            tail -n 100 /tmp/sender-build.log
          fi
          # Also try sender log gist
          if [ -f /tmp/sender-build.log ]; then gh gist create --public --filename sender-build.log /tmp/sender-build.log || true; fi

      - name: Verify no token embedded
        if: always()
        run: |
          echo "Checking APKs for token..."
          for apk in $(find sender/build/outputs receiver/build/outputs -name "*.apk" 2>/dev/null); do
            echo "Scanning $apk"
            if unzip -p "$apk" 2>/dev/null | strings | grep -Eq '[0-9]{8,}:AA[ -~]{30,}'; then echo "::warning::Possible token in $apk"; else echo "No token — OK"; fi
            if unzip -p "$apk" 2>/dev/null | strings | grep -q "imista-relay"; then echo "Relay URL found — OK"; fi
          done

      - name: Rename APKs to release names
        if: always()
        run: |
          echo "=== Searching for APKs ==="
          pwd
          echo "--- find all apk ---"
          find . -type f -name "*.apk" 2>&1 | head -n 50
          echo "--- sender outputs ---"
          ls -R sender/build 2>&1 | head -n 100
          echo "--- receiver outputs ---"
          ls -R receiver/build 2>&1 | head -n 100
          mkdir -p artifacts
          # Try known release paths first
          SENDER_APK=$(ls sender/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          RECEIVER_APK=$(ls receiver/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$SENDER_APK" ]; then SENDER_APK=$(find sender -type f -name "*.apk" 2>/dev/null | head -n 1); fi
          if [ -z "$RECEIVER_APK" ]; then RECEIVER_APK=$(find receiver -type f -name "*.apk" 2>/dev/null | head -n 1); fi
          echo "Sender APK: $SENDER_APK"
          echo "Receiver APK: $RECEIVER_APK"
          if [ -z "$SENDER_APK" ]; then
            echo "Sender APK not found — checking fallback debug"
            SENDER_APK=$(ls sender/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          fi
          if [ -z "$RECEIVER_APK" ]; then
            RECEIVER_APK=$(ls receiver/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          fi
          if [ -z "$SENDER_APK" ]; then echo "Sender APK still not found"; find . -type f 2>&1 | grep -i apk | head -n 20; ls -lh sender/build/outputs/apk/ 2>&1 | head -n 20; exit 1; fi
          if [ -z "$RECEIVER_APK" ]; then echo "Receiver APK not found"; find . -type f 2>&1 | grep -i apk | head -n 20; exit 1; fi
          cp "$SENDER_APK" artifacts/Imista-Forward-Sender-v1.0.0.apk
          cp "$RECEIVER_APK" artifacts/Imista-Forward-Receiver-v1.0.0.apk
          echo "=== Artifacts ==="
          ls -lh artifacts/
          ls -lh "$SENDER_APK" "$RECEIVER_APK"

      - name: Generate SHA256 checksums
        if: always()
        run: |
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true
          ls -lh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: artifacts/*

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > artifacts/RELEASE_NOTES.md <<'EOF'
          # Imista Forward v1.0.0 — Sender & Receiver

          Two independent Android applications with secure relay architecture.

          ## APKs
          - Imista-Forward-Sender-v1.0.0.apk (com.imista.forward.sender) — Setup-only + black forwarding screen
          - Imista-Forward-Receiver-v1.0.0.apk (com.imista.forward.receiver) — Full dashboard

          ## Architecture
          - TELEGRAM_BOT_KEY + TELEGRAM_CHAT_ID kept server-side on relay (Vercel), never in APK.
          - Relay: https://imista-relay.vercel.app — /api/register, /api/forward, /api/poll, /api/health
          - Sender: Setup-only → Black screen (IMISTA FORWARD + indicator + gear) — background via NotificationListenerService + WorkManager
          - Receiver: Full UI via relay polling (single source)

          ## Installation
          1. Deploy relay/ to Vercel with env TELEGRAM_BOT_KEY + TELEGRAM_CHAT_ID
          2. Install Sender on secondary, Receiver on primary
          3. Pair via same Pairing ID → Register → Verify → Start Forwarding
          4. Grant Notification Access on Sender

          ## Checksums
          See SHA256SUMS.txt
          EOF
          cat artifacts/RELEASE_NOTES.md

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-artifacts
          path: artifacts
      - name: Display artifacts
        run: ls -lh artifacts/ && cat artifacts/SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Imista-Forward-Sender-v1.0.0.apk
            artifacts/Imista-Forward-Receiver-v1.0.0.apk
            artifacts/SHA256SUMS.txt
          body_path: artifacts/RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
