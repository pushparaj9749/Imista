name: Build Imista Forward

on:
  push:
    branches: [ main, arena/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  RELAY_URL_DEFAULT: "https://imista-relay.vercel.app"

jobs:
  test:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    env:
      RELAY_URL: ${{ secrets.RELAY_URL || 'https://imista-relay.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          log-accepted-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version || sdkmanager --list | head -n 20
          ls $ANDROID_HOME/platforms 2>&1 | head -n 20 || true
          ls $ANDROID_SDK_ROOT/platforms 2>&1 | head -n 20 || true

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Check Telegram & Relay secrets (no leak)
        env:
          TELEGRAM_BOT_KEY: ${{ secrets.TELEGRAM_BOT_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          echo "Relay URL: ${RELAY_URL:-$RELAY_URL_DEFAULT} (token never embedded in APK)"
          if [ -z "$TELEGRAM_BOT_KEY" ]; then
            echo "::warning::TELEGRAM_BOT_KEY secret not set — relay will run in mock mode. Set it in GitHub Secrets & Vercel env to enable Telegram delivery."
          else
            echo "TELEGRAM_BOT_KEY is configured (length ${#TELEGRAM_BOT_KEY}) — kept server-side on relay, NOT in APK."
            if echo "$TELEGRAM_BOT_KEY" | grep -Eq '^[0-9]+:[A-Za-z0-9_-]+$'; then
              echo "Bot token format valid."
            else
              echo "::warning::TELEGRAM_BOT_KEY format invalid"
            fi
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::TELEGRAM_CHAT_ID secret not set — relay will auto-discover chat via bot polling (user must message bot with pairingId) or use fallback. Recommended to set it for automatic configuration."
          else
            echo "TELEGRAM_CHAT_ID is configured (length ${#TELEGRAM_CHAT_ID}) — will be used as default chat for relay server-side."
            if echo "$TELEGRAM_CHAT_ID" | grep -Eq '^-?[0-9]+$'; then
              echo "Chat ID format valid."
            else
              echo "::warning::TELEGRAM_CHAT_ID format invalid — expected numeric like 123456789"
            fi
          fi
          if [ -z "$RELAY_URL" ]; then
            echo "RELAY_URL secret not set — using default $RELAY_URL_DEFAULT. Deploy relay/ to Vercel with TELEGRAM_BOT_KEY + TELEGRAM_CHAT_ID env."
          else
            echo "RELAY_URL configured via secret (hidden)"
          fi

      - name: Run unit tests (shared)
        run: gradle :shared:testDebugUnitTest --stacktrace || ./gradlew :shared:testDebugUnitTest --stacktrace || gradle :shared:test --stacktrace
        continue-on-error: true

      - name: Run unit tests (sender)
        run: gradle :sender:testDebugUnitTest --stacktrace || ./gradlew :sender:testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Run unit tests (receiver)
        run: gradle :receiver:testDebugUnitTest --stacktrace || ./gradlew :receiver:testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Build Sender Release APK (relay mode, no token embedded)
        run: gradle :sender:assembleRelease --stacktrace || ./gradlew :sender:assembleRelease --stacktrace

      - name: Build Receiver Release APK (relay mode, no token embedded)
        run: gradle :receiver:assembleRelease --stacktrace || ./gradlew :receiver:assembleRelease --stacktrace

      - name: Verify no token embedded
        run: |
          echo "Checking APKs do NOT contain TELEGRAM_BOT_KEY..."
          for apk in $(find sender/build/outputs receiver/build/outputs -name "*.apk" 2>/dev/null); do
            echo "Scanning $apk"
            if unzip -p "$apk" 2>/dev/null | strings | grep -Eq '[0-9]{8,}:AA[ -~]{30,}' ; then
              echo "::warning::Possible token pattern in $apk — ensure relay mode only (BuildConfig.RELAY_URL, not token)"
            else
              echo "No token pattern in $apk — OK"
            fi
            if unzip -p "$apk" 2>/dev/null | strings | grep -q "imista-relay"; then
              echo "Relay URL found in $apk — OK"
            fi
          done

      - name: Rename APKs to release names
        run: |
          mkdir -p artifacts
          find sender/build/outputs -name "*.apk" -type f | head -n 20
          find receiver/build/outputs -name "*.apk" -type f | head -n 20
          SENDER_APK=$(find sender/build/outputs -name "*.apk" | head -n 1)
          RECEIVER_APK=$(find receiver/build/outputs -name "*.apk" | head -n 1)
          if [ -z "$SENDER_APK" ]; then echo "Sender APK not found"; ls -R sender/build | head -n 100; exit 1; fi
          if [ -z "$RECEIVER_APK" ]; then echo "Receiver APK not found"; ls -R receiver/build | head -n 100; exit 1; fi
          cp "$SENDER_APK" artifacts/Imista-Forward-Sender-v1.0.0.apk
          cp "$RECEIVER_APK" artifacts/Imista-Forward-Receiver-v1.0.0.apk
          ls -lh artifacts/

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "APK sizes:"
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: artifacts/*

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > artifacts/RELEASE_NOTES.md <<'EOF'
          # Imista Forward v1.0.0 — Sender & Receiver

          Two independent Android applications with secure relay architecture.

          ## APKs
          - Imista-Forward-Sender-v1.0.0.apk (com.imista.forward.sender) — Setup-only + black forwarding screen
          - Imista-Forward-Receiver-v1.0.0.apk (com.imista.forward.receiver) — Full dashboard

          ## Architecture
          - TELEGRAM_BOT_KEY + TELEGRAM_CHAT_ID kept server-side on relay (Vercel), never in APK. CI retrieves secrets during relay deploy, not app build.
          - Relay: https://imista-relay.vercel.app (or your RELAY_URL secret) — endpoints /api/register, /api/forward, /api/poll, /api/health
          - Sender: Setup-only (Notification Access, Device Admin optional, Pairing, Verify, Start Forwarding) → Black screen with IMISTA FORWARD label + subtle forwarding indicator + gear settings. Background via NotificationListenerService + WorkManager (no fake permanent alive claim).
          - Receiver: Full UI (Dashboard, Feed, Filters, Search, History, Connection, Privacy, About) via relay polling (single source, no competing getUpdates consumers).

          ## Installation
          1. Deploy relay/ to Vercel: set env TELEGRAM_BOT_KEY + TELEGRAM_CHAT_ID (both from GitHub Secrets), optionally SUPABASE_URL/KEY.
          2. Install Sender on secondary phone, Receiver on primary.
          3. Open Sender → generate Pairing ID → Register → share same ID to Receiver → Register → Verify.
          4. Grant Notification Access on Sender (and Receiver optional for mirror).
          5. Start Forwarding → Sender shows black screen; lock phone, forwarding continues in background.
          6. Trigger notifications (WhatsApp, SMS, Gmail, Instagram, Telegram, Discord) → appear in Telegram and Receiver Feed via relay.

          ## Security
          - HTTPS, Keystore EncryptedSharedPreferences, authenticated pairing (UUID, not guessable), no token in APK/logs/artifacts, no analytics, auto-prune 7 days.
          - Telegram bot messages are not Secret Chat E2E — documented honestly; optional app-level AES-GCM ready.

          ## Device Admin
          - Official DeviceAdminReceiver, explicit activation, status, user deactivation, lock test. Does NOT claim to prevent all uninstall.

          ## Checksums
          See SHA256SUMS.txt
          EOF
          cat artifacts/RELEASE_NOTES.md

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-artifacts
          path: artifacts
      - name: Display artifacts
        run: ls -lh artifacts/ && cat artifacts/SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Imista-Forward-Sender-v1.0.0.apk
            artifacts/Imista-Forward-Receiver-v1.0.0.apk
            artifacts/SHA256SUMS.txt
          body_path: artifacts/RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
