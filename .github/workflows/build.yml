name: Build Imista Forward

on:
  push:
    branches: [ main, arena/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Check TELEGRAM_BOT_KEY secret presence (no leak)
        env:
          TELEGRAM_BOT_KEY: ${{ secrets.TELEGRAM_BOT_KEY }}
        run: |
          if [ -z "$TELEGRAM_BOT_KEY" ]; then
            echo "::warning::TELEGRAM_BOT_KEY secret not set — skipping Telegram live tests (expected for public CI). Local verification must be done manually."
          else
            echo "TELEGRAM_BOT_KEY secret is configured (length ${#TELEGRAM_BOT_KEY}) — will not print value."
            # Validate format without exposing value
            if echo "$TELEGRAM_BOT_KEY" | grep -Eq '^[0-9]+:[A-Za-z0-9_-]+$'; then
              echo "Bot token format looks valid."
            else
              echo "::warning::TELEGRAM_BOT_KEY format invalid — expected 123456:ABC..."
            fi
          fi

      - name: Run unit tests (shared)
        run: ./gradlew :shared:testDebugUnitTest --stacktrace || gradle :shared:test --stacktrace

      - name: Run unit tests (sender)
        run: ./gradlew :sender:testDebugUnitTest --stacktrace || gradle :sender:test --stacktrace
        continue-on-error: true

      - name: Run unit tests (receiver)
        run: ./gradlew :receiver:testDebugUnitTest --stacktrace || gradle :receiver:test --stacktrace
        continue-on-error: true

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" --sdk_root=$ANDROID_SDK_ROOT || true
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build Sender Release APK
        run: |
          ./gradlew :sender:assembleRelease --stacktrace || gradle :sender:assembleRelease --stacktrace

      - name: Build Receiver Release APK
        run: |
          ./gradlew :receiver:assembleRelease --stacktrace || gradle :receiver:assembleRelease --stacktrace

      - name: Rename APKs to release names
        run: |
          mkdir -p artifacts
          find sender/build/outputs -name "*.apk" -type f | head -n 20
          find receiver/build/outputs -name "*.apk" -type f | head -n 20
          SENDER_APK=$(find sender/build/outputs -name "*.apk" | head -n 1)
          RECEIVER_APK=$(find receiver/build/outputs -name "*.apk" | head -n 1)
          if [ -z "$SENDER_APK" ]; then echo "Sender APK not found"; exit 1; fi
          if [ -z "$RECEIVER_APK" ]; then echo "Receiver APK not found"; exit 1; fi
          cp "$SENDER_APK" artifacts/Imista-Forward-Sender-v1.0.0.apk
          cp "$RECEIVER_APK" artifacts/Imista-Forward-Receiver-v1.0.0.apk
          ls -lh artifacts/

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "APK sizes:"
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: artifacts/*

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > artifacts/RELEASE_NOTES.md <<'EOF'
          # Imista Forward v1.0.0 — Sender & Receiver

          Two independent Android applications for private phone-to-phone notification forwarding via Telegram Bot API.

          ## APKs
          - Imista-Forward-Sender-v1.0.0.apk (package: com.imista.forward.sender)
          - Imista-Forward-Receiver-v1.0.0.apk (package: com.imista.forward.receiver)

          ## Installation
          1. Install Sender on secondary phone, Receiver on primary phone.
          2. Create bot via @BotFather, get token (never hardcode).
          3. Start private chat with bot on both phones.
          4. Enter same Bot Token & Chat ID in both apps → Test connection.
          5. Grant Notification Access on Sender (and optionally on Receiver for Telegram reconstruction).
          6. Choose apps to forward in Sender → App Selection.
          7. Trigger notification → verify appears in Telegram and Receiver Feed.

          ## Security
          - Keystore-backed EncryptedSharedPreferences
          - No hardcoded secrets, no logs of content
          - Telegram messages are HTTPS but not E2E Secret Chats — optional app-level AES-GCM encryption available
          - No analytics, no ads

          ## Architecture Honesty
          - Telegram Bot API does NOT push bot-sent messages to another app. Receiver reconstructs via Telegram notification listening (requires Telegram notifications enabled). Only Receiver polls getUpdates for pairing commands; Sender never polls to avoid single-consumer conflicts.

          ## Device Admin (Sender Optional)
          - Official DeviceAdminReceiver + DevicePolicyManager
          - Explicit activation, user-deactivatable, does NOT make app uninstall-proof (standard Android allows deactivation then uninstall). Forwarding works without it.

          ## Checksums
          See SHA256SUMS.txt
          EOF
          cat artifacts/RELEASE_NOTES.md

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-artifacts
          path: artifacts
      - name: Display artifacts
        run: ls -lh artifacts/ && cat artifacts/SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Imista-Forward-Sender-v1.0.0.apk
            artifacts/Imista-Forward-Receiver-v1.0.0.apk
            artifacts/SHA256SUMS.txt
          body_path: artifacts/RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
