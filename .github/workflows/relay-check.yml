name: Relay Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Probe relay endpoints
    runs-on: ubuntu-latest
    env:
      RELAY: "https://effpkfajwqetiddcqopi.supabase.co/functions/v1/imista-relay"
    steps:
      - name: Health
        run: |
          set -u
          OUT=/tmp/report.md
          echo "### Relay E2E $(date -u +%FT%TZ)" > "$OUT"
          echo "" >> "$OUT"
          probe() {
            U="$1"; echo "########## $U"
            CODE=$(curl -sS -L --max-time 30 -o /tmp/b -w '%{http_code}' "$U" 2>/tmp/err || echo "000")
            BODY=$(head -c 400 /tmp/b 2>/dev/null | tr '\n' ' ')
            echo "HTTP $CODE"; echo "BODY $BODY"
            { echo "- \`$U\` → HTTP **$CODE**"; echo '  ```'; echo "  $BODY"; echo '  ```'; } >> "$OUT"
          }
          probe "$RELAY/api/health"
          echo "----- current report -----"; cat "$OUT"
          cp "$OUT" /tmp/health.md

      - name: End-to-end round trip (code pairing)
        run: |
          set -u
          SENDER="sender-ci"
          RECEIVER="receiver-ci"
          OUT=/tmp/e2e.md
          echo "" > "$OUT"
          log() { echo "$1"; echo "$1" >> "$OUT"; }

          log "#### Sender registers without code → relay mints 6-digit code"
          R1=$(curl -sS -m 30 -X POST "$RELAY/api/register" -H 'Content-Type: application/json' \
            -d "{\"deviceId\":\"$SENDER\",\"deviceName\":\"CI sender\",\"role\":\"SENDER\"}")
          log "\`$R1\`"
          PAIR=$(echo "$R1" | sed -n 's/.*"code":"\([0-9]\{6\}\)".*/\1/p')
          log "parsed code: \`$PAIR\`"
          if [ -z "$PAIR" ]; then log "❌ relay did not return a 6-digit code"; exit 0; fi

          log "#### Receiver joins with that code"
          R2=$(curl -sS -m 30 -X POST "$RELAY/api/register" -H 'Content-Type: application/json' \
            -d "{\"code\":\"$PAIR\",\"deviceId\":\"$RECEIVER\",\"deviceName\":\"CI receiver\",\"role\":\"RECEIVER\"}")
          log "\`$R2\`"

          log "#### Receiver with a bogus code must fail"
          B=$(curl -sS -m 30 -X POST "$RELAY/api/register" -H 'Content-Type: application/json' \
            -d '{"code":"000000","deviceId":"nobody","role":"RECEIVER"}')
          log "\`$B\`"

          log "#### Link status (no token on device)"
          L=$(curl -sS -m 30 "$RELAY/api/link?code=$PAIR")
          log "\`$L\`"

          log "#### Forward a notification"
          MSGID="ci-$(date +%s)"
          F=$(curl -sS -m 30 -X POST "$RELAY/api/forward" -H 'Content-Type: application/json' \
            -H "X-Pairing-Id: $PAIR" -H "X-Device-Id: $SENDER" \
            -d "{\"payload\":{\"id\":\"$MSGID\",\"packageName\":\"com.whatsapp\",\"appName\":\"WhatsApp\",\"title\":\"CI test\",\"text\":\"hello from ci\",\"timestamp\":$(date +%s000)}}")
          log "\`$F\`"

          log "#### Poll as receiver"
          P=$(curl -sS -m 30 "$RELAY/api/poll?pairingId=$PAIR&deviceId=$RECEIVER&since=0&limit=10")
          log "\`$P\`"

          log "#### Unauthorized forward must be 403"
          U=$(curl -sS -m 30 -o /tmp/u.txt -w '%{http_code}' -X POST "$RELAY/api/forward" -H 'Content-Type: application/json' \
            -H "X-Pairing-Id: $PAIR" -H "X-Device-Id: intruder" -d '{"payload":{"id":"x","text":"nope"}}')
          log "status=$U body=\`$(cat /tmp/u.txt)\`"

          echo "$P" | grep -q "$MSGID" && log "✅ message reached receiver via poll" || log "❌ message NOT found in poll"
          echo "$R1" | grep -q '"code"' && log "✅ sender got a relay-minted code (no manual token/chat id)" || log "❌ no code minted"

      - name: Publish report to tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          BODY=$(cat /tmp/health.md /tmp/e2e.md)
          echo "$BODY"
          ISSUE=$(gh api "repos/$REPO/issues?labels=relay-probe&state=open" --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$ISSUE" ] || [ "$ISSUE" = "null" ]; then
            gh api "repos/$REPO/labels" -f name=relay-probe -f color=0e8a16 >/dev/null 2>&1 || true
            ISSUE=$(gh api "repos/$REPO/issues" -f title="Relay probe report" -f body="Automated relay E2E reports." -f "labels[]=relay-probe" --jq '.number')
          fi
          gh api "repos/$REPO/issues/$ISSUE/comments" -f body="$BODY" >/dev/null
          echo "posted to #$ISSUE"
