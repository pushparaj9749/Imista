name: Relay Diagnose

on:
  workflow_dispatch:
  push:
    paths:
      - 'relay/**'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate relay hosts
        run: |
          set -u
          for U in \
            "https://imista-relay.vercel.app/api/health" \
            "https://imista-relay-app.vercel.app/api/health" \
            "https://imista-relay-wsta.vercel.app/api/health" \
            "https://imista-relay-abwayhc3k-wsta.vercel.app/api/health" \
            "https://wsta.vercel.app/" ; do
            echo "########## $U"
            curl -sS -L --max-time 25 -o /tmp/b -w 'code=%{http_code} size=%{size_download} redirects=%{num_redirects}\n' "$U" 2>&1 || echo "curl-error"
            head -c 240 /tmp/b 2>/dev/null || true
            echo
          done
