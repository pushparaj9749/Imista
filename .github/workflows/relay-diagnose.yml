name: Relay Diagnose

on:
  workflow_dispatch:
  push:
    paths:
      - 'relay/**'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: DNS + TLS + HTTP diagnostics
        run: |
          set -x
          for H in imista-relay.vercel.app imista-relay-wsta.vercel.app wsta.vercel.app; do
            echo "########## $H"
            getent hosts "$H" || echo "no dns"
            timeout 20 openssl s_client -connect "$H:443" -servername "$H" </dev/null 2>&1 | head -20 || true
            curl -sS -o /dev/null -m 20 -w "code=%{http_code} ssl=%{ssl_verify_result} ip=%{remote_ip}\n" "https://$H/" || true
          done
