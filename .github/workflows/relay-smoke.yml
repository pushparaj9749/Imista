name: Relay Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'relay/**'

jobs:
  smoke:
    name: Probe relay health endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Probe production alias
        run: |
          set -u
          U="https://imista-relay.vercel.app/api/health"
          echo "=== $U"
          CODE=$(curl -sS -L --max-time 30 -o /tmp/body.txt -w '%{http_code}' "$U" || echo "000")
          echo "HTTP $CODE"
          echo "----- body -----"
          head -c 800 /tmp/body.txt || true
          echo
          echo "----------------"
          if [ "$CODE" != "200" ]; then
            echo "::error::relay not reachable (HTTP $CODE)"
            exit 1
          fi
          grep -q '"ok":true' /tmp/body.txt || { echo "::error::unexpected body"; exit 1; }
